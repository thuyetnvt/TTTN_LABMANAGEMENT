name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: dotnet restore
      - run: dotnet restore ../lab-backend.Tests/LabManagementAPI.Tests.csproj
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test ../lab-backend.Tests/LabManagementAPI.Tests.csproj --configuration Release --no-restore
      - run: dotnet ef migrations script --idempotent --no-build --configuration Release --output migration-script.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: lab-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        shell: bash
        run: |
          set -o pipefail
          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT

          set +e
          timeout 60s npm audit --audit-level=high 2>&1 | tee "$audit_log"
          audit_status="${PIPESTATUS[0]}"
          set -e

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$audit_status" -eq 124 ] || grep -Eiq 'audit endpoint returned an error|Invalid package tree|endpoint is being retired|audit [0-9]{3} (Bad Request|Service Unavailable|Internal Server Error)' "$audit_log"; then
            echo '::warning::npm audit could not reach a usable registry audit endpoint; npm ci, tests, and build remain required.'
            exit 0
          fi

          exit 1
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: lab-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start isolated E2E stack
        run: docker compose -p labmanagement-e2e -f ../docker-compose.e2e.yml up -d --build --wait
      - name: Run E2E for all five roles
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
          E2E_TEST_DATABASE: "1"
          E2E_BUSINESS_FLOW: "1"
          E2E_ADMIN_USERNAME: admin
          E2E_MANAGER_USERNAME: truonglab
          E2E_DEPUTY_USERNAME: pholab
          E2E_TEACHER_USERNAME: giangvien1
          E2E_STUDENT_USERNAME: sv1
          E2E_ADMIN_PASSWORD: E2e-Test-Password-2026!
          E2E_BUSINESS_PASSWORD: E2e-Test-Password-2026!
          E2E_ROLE_PASSWORD: E2e-Test-Password-2026!
      - name: Show E2E service logs on failure
        if: failure()
        run: docker compose -p labmanagement-e2e -f ../docker-compose.e2e.yml logs --no-color --tail=300
      - name: Stop isolated E2E stack
        if: always()
        run: docker compose -p labmanagement-e2e -f ../docker-compose.e2e.yml down --volumes --remove-orphans

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_PASSWORD: ci-app-password
          JWT_KEY: ci-jwt-key-for-compose-validation-only-32chars
          SEED_DEFAULT_PASSWORD: ci-seed-password
      - run: docker build -t labmanagement-backend ./lab-backend
      - run: docker build -t labmanagement-frontend ./lab-frontend

  deploy-vps:
    name: Deploy VPS
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/fix-table-fixed-columns')
    needs: [backend, frontend, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart production services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          tr -d '\r' < scripts/deploy-vps.sh | \
            ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -s"
